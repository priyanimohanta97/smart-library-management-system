# ==========================================
# Smart Library Management System
# Spring Boot Configuration
# ==========================================

spring.application.name=LibraryManagementSystem

# Load environment variables from .env in the application working directory
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8080}

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
# JWT_SECRET must be set in .env. Use a secure random secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Initial Administrator Configuration
# ==========================================
# Leave ADMIN_EMAIL and ADMIN_PASSWORD empty to skip automatic admin creation.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Library Administrator}

# ==========================================
# Centralized Borrowing Policy Configuration
# ==========================================
app.borrowing.max-active-loans=${BORROWING_MAX_ACTIVE_LOANS:4}
app.borrowing.loan-duration-days=${BORROWING_LOAN_DURATION_DAYS:14}
app.borrowing.overdue-grace-period-days=${BORROWING_OVERDUE_GRACE_DAYS:0}

# ==========================================
# CORS Configuration
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# Starter Book Dataset Import Configuration
# ==========================================
app.book-dataset.import.enabled=${BOOK_DATASET_IMPORT_ENABLED:true}
app.book-dataset.import.resource-path=${BOOK_DATASET_RESOURCE_PATH:data/books-dataset.csv}
app.book-dataset.import.fallback-resource-path=${BOOK_DATASET_FALLBACK_RESOURCE_PATH:data/library_real_books_starter_dataset.csv}
app.book-dataset.import.default-copies=${BOOK_DATASET_DEFAULT_COPIES:3}
app.book-dataset.import.force=${BOOK_DATASET_IMPORT_FORCE:false}
