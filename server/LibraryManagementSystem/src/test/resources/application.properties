spring.application.name=LibraryManagementSystem-Test

# In-memory H2 database for test suite isolation
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Test Configuration
app.jwt.secret=test_secure_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256_test!
app.jwt.expiration-ms=3600000

# Borrowing Policy Test Defaults
app.borrowing.max-active-loans=4
app.borrowing.loan-duration-days=14
app.borrowing.overdue-grace-period-days=0

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173
